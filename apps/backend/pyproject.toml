[project]
name = "parallel-api"
version = "0.1.0"
description = "Parallel application API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.36,<2",
    "fastapi>=0.115,<1",
    "geoalchemy2>=0.17,<1",
    "httpx>=0.28,<1",
    "Pillow>=11,<13",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sentry-sdk[fastapi]>=2.20,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires a running PostgreSQL/PostGIS database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
