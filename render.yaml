services:
  - type: web
    name: parallel-api
    runtime: python
    rootDir: apps/backend
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
